name: Trendly AI backend tests

on:
  push:
    branches:
      - security/remediate-public-db-20261109
    paths:
      - "backend/**"
      - ".github/workflows/trendly-ai-backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/trendly-ai-backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
